<!DOCTYPE html>
<html>
<head>
    <title>The Grandmaster's Date</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="level-1" class="game-level">
        <div class="ui-overlay">
            <h2>Level 1: Geospatial Analysis</h2>
            <p>Drag us to our favorite seafood soup spot in Mumbai!</p>
        </div>
        <div id="map"></div>
    </div>

    <div id="level-2" class="game-level hidden">
        <div class="ui-overlay">
            <h2>Level 2: Tactical Precision</h2>
            <p>One more move before your destination. Find the Checkmate.</p>
        </div>
        <div id="board" style="width: 400px; margin: 100px auto;"></div>
    </div>

    <div id="level-final" class="game-level hidden">
        <div class="luxe-card">
            <h1>Checkmate! ❤️</h1>
            <p>You've processed all the data and made the right moves.</p>
            <h2 style="color: gold;">Will you be my Valentine?</h2>
            <p>Reservation @ 8:00 PM</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
