<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Nom Quest 🍓</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Quicksand:wght@500&display=swap');
        :root { --matcha: #9fb8ad; --strawberry: #ffb5a7; --cream: #fdfaf6; }
        
        /* MOVING GLITTER ANIMATION */
        body { 
            background-color: var(--cream); 
            margin: 0; 
            color: #6d597a; 
            text-align: center; 
            overflow-x: hidden; 
            position: relative;
        }

        /* The Moving Sparkles Layer */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            z-index: -1;
            animation: moveGlitter 60s linear infinite;
            opacity: 0.6;
        }

        @keyframes moveGlitter {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }
        
        .game-level { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .active-level { display: flex !important; }
        h2 { font-family: 'Gaegu', cursive; color: var(--matcha); font-size: 3rem; margin: 10px 0; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 35px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            max-width: 90vw;
        }

        #level-0 { 
            background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('wizard-bg.jpg'); 
            background-size: cover; background-position: center; justify-content: flex-start; padding-top: 12vh; 
        }
        
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        @keyframes glow { 0% { text-shadow: 0 0 10px #FFFD74; } 50% { text-shadow: 0 0 30px #FFFD74; } 100% { text-shadow: 0 0 10px #FFFD74; } }
        .magic-container { animation: float 4s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; width: 100%; }
        #level-0 h2 { color: #FFFD74; animation: glow 3s ease-in-out infinite; font-size: 4rem; text-shadow: 2px 2px 15px rgba(0,0,0,0.8); }

        .speech-bubble { background: white; border-radius: 20px; padding: 15px; position: relative; color: #2D2424; font-weight: bold; max-width: 250px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-right: 180px; }
        .speech-bubble::after { content: ''; position: absolute; bottom: -10px; left: 20%; border-width: 10px 10px 0; border-style: solid; border-color: white transparent transparent; }
        .mini-button { background: #ffb5a7; border: none; padding: 12px 25px; border-radius: 25px; color: white; cursor: pointer; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(255,181,167,0.3); }
        .mini-button:hover { transform: scale(1.05); background: #ff9a8b; }
