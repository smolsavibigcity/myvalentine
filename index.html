<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Nom Quest 🍓</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Quicksand:wght@500&display=swap');
        :root { --matcha: #9fb8ad; --strawberry: #ffb5a7; --cream: #fdfaf6; }
        body { background-color: var(--cream); font-family: 'Quicksand', sans-serif; margin: 0; color: #6d597a; text-align: center; }
        .hidden { display: none !important; }
        .game-level { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        h2 { font-family: 'Gaegu', cursive; color: var(--matcha); font-size: 2.5rem; }
        #map { width: 350px; height: 400px; border: 10px solid white; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #board { border: 10px solid white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin: 0 auto; }
        .luxe-button { background: var(--strawberry); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-family: 'Gaegu', cursive; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="level-1" class="game-level">
        <h2>Level 1: Geospatial Analysis 🍵</h2>
        <p>Drag us to our favorite seafood soup spot!</p>
        <div id="map"></div>
    </div>

    <div id="level-2" class="game-level hidden">
        <h2>Level 2: Strategic Appreciation 🍓</h2>
        <p>Move the Rook (🏰) to the top row for Checkmate!</p>
        <div id="board" style="width: 350px;"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        const sujataApartment = [18.54014, 73.88345];
        const suonmoi = [18.53755, 73.87965];
        let map;

        window.onload = function() {
            map = L.map('map').setView(sujataApartment, 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // THIS FIXES THE PHOTO MARKER
            const usIcon = L.divIcon({
                className: 'couple-marker',
                html: '<img src="us.jpg" style="width:60px;height:60px;border-radius:50%;border:4px solid white;object-fit:cover;" onerror="this.src=\'https://via.placeholder.com/60/ffb5a7/ffffff?text=US\'">',
                iconSize: [60, 60]
            });

            const marker = L.marker(sujataApartment, { icon: usIcon, draggable: true }).addTo(map);
            marker.on('dragend', function() {
                if (marker.getLatLng().distanceTo(L.latLng(suonmoi)) < 400) {
                    alert("Congratulations! 🍓 Level 2 Unlocked.");
                    nextLevel(2);
                }
            });
            setTimeout(() => { map.invalidateSize(); }, 500);
        };

        function nextLevel(lvl) {
            document.querySelectorAll('.game-level').forEach(el => el.classList.add('hidden'));
            document.getElementById('level-' + lvl).classList.remove('hidden');
            if (lvl === 2) setTimeout(startChess, 500);
        }

        function startChess() {
            // THIS FIXES THE PIECES USING EMOJIS
            const emojiTheme = (obj) => {
                const pieces = { 'wR': '🏰', 'wK': '♔', 'bK': '♚', 'bP': '♟' };
                return '<div style="font-size: 40px; line-height: 50px; text-align: center;">' + (pieces[obj.piece] || '') + '</div>';
            };

            Chessboard('board', {
                draggable: true,
                pieceTheme: emojiTheme,
                position: '4k1/5ppp/8/8/8/8/8/4R1K1', 
                onDrop: function(source, target) {
                    if (target.includes('8')) {
                        alert("Checkmate! 🍵");
                    }
                }
            });
        }
    </script>
</body>
</html>
