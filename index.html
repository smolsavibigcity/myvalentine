<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Nom Quest 🍓</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Quicksand:wght@500&display=swap');
        :root { --matcha: #9fb8ad; --strawberry: #ffb5a7; --cream: #fdfaf6; }
        body { background-color: var(--cream); font-family: 'Quicksand', sans-serif; margin: 0; color: #6d597a; text-align: center; overflow-x: hidden; }
        .hidden { display: none !important; }
        .game-level { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        h2 { font-family: 'Gaegu', cursive; color: var(--matcha); font-size: 3rem; margin: 10px 0; }
        
        /* RESPONSIVE MAP: Bigger on laptops, fits on phones */
        #map { 
            width: 90vw; 
            max-width: 800px; 
            height: 60vh; 
            max-height: 500px;
            border: 12px solid white; 
            border-radius: 40px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); 
            background: #eee; 
        }

        /* RESPONSIVE CHESSBOARD */
        .chess-container { 
            width: 90vw; 
            max-width: 450px; 
            aspect-ratio: 1 / 1;
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            border: 12px solid white; 
            border-radius: 15px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); 
            margin: 20px auto; 
            background: white; 
        }
        
        .square { display: flex; align-items: center; justify-content: center; font-size: 6vw; cursor: pointer; }
        @media (min-width: 600px) { .square { font-size: 40px; } }
        
        .white-sq { background-color: #fdfaf6; }
        .black-sq { background-color: #9fb8ad; opacity: 0.6; }
        .luxe-button { background: var(--strawberry); color: white; border: none; padding: 20px 50px; border-radius: 60px; font-family: 'Gaegu', cursive; font-size: 2rem; cursor: pointer; transition: 0.3s; }
        .luxe-button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="level-1" class="game-level">
        <h2>Level 1: Geospatial Analysis 🍵</h2>
        <p>Drag us to our favorite seafood soup spot!</p>
        <div id="map"></div>
    </div>

    <div id="level-2" class="game-level hidden">
        <h2>Level 2: Strategic Appreciation 🍓</h2>
        <p style="font-style: italic; color: #ffb5a7; font-weight: bold; font-size: 1.2rem;">"Magnus Carlsen Meesho Edition... checkmate me if you can ;)"</p>
        <div id="chess-board" class="chess-container"></div>
        <p>Tap your Rook (🏰) and slide it to the top row!</p>
    </div>

    <div id="level-3" class="game-level hidden">
        <h2>Level 3: The Verdict ⚖️</h2>
        <img src="us.jpg" style="width: 90%; max-width: 400px; border: 15px solid white; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1);" onerror="this.src='https://via.placeholder.com/400x300?text=Upload+us.jpg'">
        <h2 style="color: var(--strawberry); margin-top: 30px;">Will you be my Valentine?</h2>
        <button class="luxe-button" onclick="alert('Yay! ❤️ Motion Granted!')">Yes!</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const sujata = [18.54014, 73.88345];
        const soup = [18.53755, 73.87965];
        let map;

        window.onload = function() {
            map = L.map('map').setView(sujata, 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            const usIcon = L.divIcon({
                className: 'custom-marker',
                html: '<img src="us.jpg" style="width:80px;height:80px;border-radius:50%;border:5px solid white;object-fit:cover;" onerror="this.src=\'https://via.placeholder.com/80/ffb5a7/ffffff?text=US\'">',
                iconSize: [80, 80]
            });

            const marker = L.marker(sujata, { icon: usIcon, draggable: true }).addTo(map);
            marker.on('dragend', function() {
                if (marker.getLatLng().distanceTo(L.latLng(soup)) < 400) {
                    alert("Level 1 Clear! 🍓");
                    nextLevel(2);
                }
            });
            setTimeout(() => { map.invalidateSize(); }, 800);
        };

        function nextLevel(lvl) {
            document.querySelectorAll('.game-level').forEach(el => el.classList.add('hidden'));
            document.getElementById('level-' + lvl).classList.remove('hidden');
            if (lvl === 2) createChess();
        }

        function createChess() {
            const board = document.getElementById('chess-board');
            board.innerHTML = '';
            const pieces = { 7: '♚', 15: '♟', 14: '♟', 56: '🏰' };

            for (let i = 0; i < 64; i++) {
                const row = Math.floor(i / 8);
                const sq = document.createElement('div');
                sq.className = 'square ' + ((row + (i % 8)) % 2 === 0 ? 'white-sq' : 'black-sq');
                if (pieces[i]) sq.innerText = pieces[i];

                sq.onclick = () => {
                    if (window.rookSelected) {
                        if (Math.floor(i / 8) === 0) { 
                            sq.innerText = '🏰';
                            document.querySelectorAll('.square').forEach(s => { if(s.innerText === '🏰' && s !== sq) s.innerText = ''; });
                            setTimeout(() => { alert("Checkmate! Magnus would be proud. 😉"); nextLevel(3); }, 300);
                        }
                    } else if (sq.innerText === '🏰') {
                        window.rookSelected = true;
                        sq.style.backgroundColor = 'rgba(255, 181, 167, 0.5)';
                    }
                };
                board.appendChild(sq);
            }
        }
    </script>
</body>
</html>
