<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Nom Quest 🍓</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Quicksand:wght@500&display=swap');
        :root { --matcha: #9fb8ad; --strawberry: #ffb5a7; --cream: #fdfaf6; }
        body { background-color: var(--cream); font-family: 'Quicksand', sans-serif; margin: 0; color: #6d597a; text-align: center; }
        .hidden { display: none !important; }
        .game-level { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        h2 { font-family: 'Gaegu', cursive; color: var(--matcha); font-size: 3rem; margin: 10px 0; }
        #map { width: 350px; height: 400px; border: 10px solid white; border-radius: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); background: #eee; outline: 2px solid #ffb5a7; }
        .chess-container { width: 360px; height: 360px; display: grid; grid-template-columns: repeat(8, 1fr); border: 10px solid #6d597a; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin: 20px auto; }
        .square { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 35px; cursor: pointer; }
        /* Classic Wood/Matcha Theme */
        .white-sq { background-color: #fdfaf6; }
        .black-sq { background-color: #9fb8ad; }
        .luxe-button { background: var(--strawberry); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-family: 'Gaegu', cursive; font-size: 1.8rem; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="level-1" class="game-level">
        <h2>Level 1: Geospatial Analysis 🍵</h2>
        <p>Drag us to our favorite seafood soup spot!</p>
        <div id="map"></div>
    </div>

    <div id="level-2" class="game-level hidden">
        <h2>Level 2: Strategic Appreciation 🍓</h2>
        <p style="font-style: italic; color: #ffb5a7; font-weight: bold;">"Magnus Carlsen Meesho Edition... checkmate me if you can ;)"</p>
        <div id="chess-board" class="chess-container"></div>
        <p>Move the Black Bishop (♝) to d6 to reveal the checkmate!</p>
    </div>

    <div id="level-3" class="game-level hidden">
        <h2>Level 3: The Verdict ⚖️</h2>
        <img src="us.jpg" style="width: 280px; border: 15px solid white; border-radius: 20px;" onerror="this.src='https://via.placeholder.com/280/ffb5a7/ffffff?text=US'">
        <h2 style="color: var(--strawberry);">Will you be my Valentine?</h2>
        <button class="luxe-button" onclick="alert('Yay! ❤️ Motion Granted!')">Yes!</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const sujata = [18.54014, 73.88345];
        const soup = [18.53755, 73.87965];
        let map;

        window.onload = function() {
            map = L.map('map').setView(sujata, 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            const usIcon = L.divIcon({
                className: 'custom-marker',
                html: '<img src="us.jpg" style="width:70px;height:70px;border-radius:50%;border:4px solid white;object-fit:cover;" onerror="this.src=\'https://via.placeholder.com/70/ffb5a7/ffffff?text=US\'">',
                iconSize: [70, 70]
            });
            const marker = L.marker(sujata, { icon: usIcon, draggable: true }).addTo(map);
            marker.on('dragend', function() {
                if (marker.getLatLng().distanceTo(L.latLng(soup)) < 400) {
                    alert("Level 1 Clear! 🍓");
                    nextLevel(2);
                }
            });
            setTimeout(() => { map.invalidateSize(); }, 600);
        };

        function nextLevel(lvl) {
            document.querySelectorAll('.game-level').forEach(el => el.classList.add('hidden'));
            document.getElementById('level-' + lvl).classList.remove('hidden');
            if (lvl === 2) createChess();
        }

function createChess() {
    const board = document.getElementById('chess-board');
    board.innerHTML = '';
    
    // PIECE MAPPING (0-63 Grid):
    // a3 = 40 | b3 = 41 | c3 = 42
    // b8 = 1  | d6 = 19
    const pieces = {
        40: '♔', // a3 - White King
        41: '♟', // b3 - Black Pawn (Between King and Rook)
        42: '♜', // c3 - BLACK ROOK
        1:  '♝', // b8 - BLACK BISHOP (The piece to move!)
        56: '♚', // a1 - Black King
        53: '♖', // f2 - White Rook
        22: '♗', // g6 - White Bishop
        15: '♙'  // h7 - White Pawn
    };

    for (let i = 0; i < 64; i++) {
        const row = Math.floor(i / 8);
        const col = i % 8;
        const sq = document.createElement('div');
        
        // Color logic: ensures b8 (index 1) is a dark square
        sq.className = 'square ' + ((row + col) % 2 === 0 ? 'white-sq' : 'black-sq');
        
        if (pieces[i]) sq.innerText = pieces[i];

        sq.onclick = () => {
            if (window.bishopSelected) {
                // WINNING MOVE: Move Bishop to d6 (index 19)
                if (i === 19) {
                    sq.innerText = '♝';
                    // Remove old Bishop from b8
                    document.querySelectorAll('.square').forEach(s => { 
                        if(s.innerText === '♝' && s !== sq) s.innerText = ''; 
                    });
                    setTimeout(() => { 
                        alert("Checkmate! Magnus Meesho Edition... case closed. 😉🍓"); 
                        nextLevel(3); 
                    }, 300);
                } else {
                    alert("Not quite! Move the Bishop to d6 to discover the checkmate.");
                    window.bishopSelected = false;
                }
            } else if (sq.innerText === '♝') {
                window.bishopSelected = true;
                sq.style.backgroundColor = 'rgba(255, 181, 167, 0.7)';
            }
        };
        board.appendChild(sq);
    }
}
    </script>
</body>
</html>
