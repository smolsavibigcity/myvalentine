<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Nom Quest 🍓</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Quicksand:wght@500&display=swap');
        :root { --matcha: #9fb8ad; --strawberry: #ffb5a7; --cream: #fdfaf6; }
        body { background-color: var(--cream); font-family: 'Quicksand', sans-serif; margin: 0; color: #6d597a; text-align: center; }
        .hidden { display: none !important; }
        .game-level { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        h2 { font-family: 'Gaegu', cursive; color: var(--matcha); font-size: 2.5rem; margin: 5px 0; }
        
        /* Map Visibility: Adding a pink border to confirm the box exists */
        #map { width: 350px; height: 400px; border: 10px solid white; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: #eee; outline: 2px solid #ffb5a7; }
        
        .chess-container { width: 320px; height: 320px; display: grid; grid-template-columns: repeat(8, 1fr); border: 10px solid white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin: 20px auto; background: white; }
        .square { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; }
        .white-sq { background-color: #fdfaf6; }
        .black-sq { background-color: #9fb8ad; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="level-1" class="game-level">
        <h2>Level 1: Geospatial Analysis 🍵</h2>
        <p>Drag us to our favorite seafood soup spot!</p>
        <div id="map"></div>
    </div>

    <div id="level-2" class="game-level hidden">
        <h2>Level 2: Strategic Appreciation 🍓</h2>
        <p style="font-style: italic; color: #ffb5a7; font-weight: bold;">"Magnus Carlsen Meesho Edition... checkmate me if you can ;)"</p>
        <p>Tap your Rook (🏰) and slide it to the top row!</p>
        <div id="chess-board" class="chess-container"></div>
    </div>

    <div id="level-3" class="game-level hidden">
        <h2>Level 3: The Verdict ⚖️</h2>
        <img src="us.jpg" style="width: 280px; border: 10px solid white; border-radius: 10px;" onerror="this.src='https://via.placeholder.com/280x200?text=Upload+us.jpg'">
        <h2 style="color: var(--strawberry);">Will you be my Valentine?</h2>
        <button onclick="alert('Yay! ❤️ Motion Granted!')" style="background: var(--strawberry); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-family: 'Gaegu', cursive; font-size: 1.5rem; cursor: pointer;">Yes!</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const sujata = [18.54014, 73.88345];
        const soup = [18.53755, 73.87965];
        let map;

        function loadMap() {
            if (map) return;
            map = L.map('map').setView(sujata, 16);
            
            // USE STADIA TILES (More reliable for GitHub Pages)
            L.tileLayer('https://tiles.stadiamaps.com/tiles/osm_bright/{z}/{x}/{y}{r}.png').addTo(map);

            const usIcon = L.divIcon({
                className: 'custom-marker',
                html: '<img src="us.jpg" style="width:60px;height:60px;border-radius:50%;border:4px solid white;object-fit:cover;" onerror="this.src=\'https://via.placeholder.com/60/ffb5a7/ffffff?text=US\'">',
                iconSize: [60, 60]
            });

            const marker = L.marker(sujata, { icon: usIcon, draggable: true }).addTo(map);
            marker.on('dragend', function() {
                if (marker.getLatLng().distanceTo(L.latLng(soup)) < 400) {
                    alert("Level 1 Clear! 🍓");
                    nextLevel(2);
                }
            });

            // TRIPLE-FORCE REFRESH for the Map
            setTimeout(() => { map.invalidateSize(); }, 200);
            setTimeout(() => { map.invalidateSize(); }, 1000);
        }

        window.onload = loadMap;

        function nextLevel(lvl) {
            document.querySelectorAll('.game-level').forEach(el => el.classList.add('hidden'));
            document.getElementById('level-' + lvl).classList.remove('hidden');
            if (lvl === 2) createChess();
        }

        function createChess() {
            const board = document.getElementById('chess-board');
            board.innerHTML = '';
            // Chess Logic: Clean vertical path on the A-file (leftmost column)
            const pieces = {
                7: '♚',   // Black King at h8
                15: '♟',  // Black Pawn at h7
                14: '♟',  // Black Pawn at g7
                56: '🏰'  // White Rook at a1
            };

            for (let i = 0; i < 64; i++) {
                const row = Math.floor(i / 8);
                const col = i % 8;
                const sq = document.createElement('div');
                sq.className = 'square ' + ((row + col) % 2 === 0 ? 'white-sq' : 'black-sq');
                if (pieces[i]) sq.innerText = pieces[i];

                sq.onclick = () => {
                    if (window.rookSelected) {
                        // Move to a8 (top left corner)
                        if (i === 0) {
                            sq.innerText = '🏰';
                            document.querySelectorAll('.square').forEach(s => { if(s.innerText === '🏰' && s !== sq) s.innerText = ''; });
                            setTimeout(() => { alert("Checkmate! Magnus would be proud. 😉"); nextLevel(3); }, 300);
                        }
                    } else if (i === 56 || sq.innerText === '🏰') {
                        window.rookSelected = true;
                        sq.style.backgroundColor = '#ffb5a7';
                    }
                };
                board.appendChild(sq);
            }
        }
    </script>
</body>
</html>
