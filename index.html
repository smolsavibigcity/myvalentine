<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Nom Quest 🍓</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Quicksand:wght@500&display=swap');
        :root { --matcha: #9fb8ad; --strawberry: #ffb5a7; --cream: #fdfaf6; }
        body { background-color: var(--cream); font-family: 'Quicksand', sans-serif; margin: 0; color: #6d597a; text-align: center; }
        .hidden { display: none !important; }
        .game-level { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        h2 { font-family: 'Gaegu', cursive; color: var(--matcha); font-size: 2.5rem; }
        #map { width: 350px; height: 400px; border: 10px solid white; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* CUTE CUSTOM CHESSBOARD */
        .chess-container { width: 320px; height: 320px; display: grid; grid-template-columns: repeat(8, 1fr); border: 10px solid white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin: 20px auto; }
        .square { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .white-sq { background-color: #f0d9b5; }
        .black-sq { background-color: #b58863; }
        .rook { cursor: grab; user-select: none; }
    </style>
</head>
<body>

    <div id="level-1" class="game-level">
        <h2>Level 1: Geospatial Analysis 🍵</h2>
        <p>Drag us to our favorite seafood soup spot!</p>
        <div id="map"></div>
    </div>

    <div id="level-2" class="game-level hidden">
        <h2>Level 2: Strategic Appreciation 🍓</h2>
        <p>Tap the Rook (🏰) and then tap the top row for Checkmate!</p>
        <div id="chess-board" class="chess-container"></div>
    </div>

    <div id="level-3" class="game-level hidden">
        <h2>Level 3: The Verdict ⚖️</h2>
        <img src="first-photo.jpg" style="width: 250px; border: 10px solid white; border-radius: 10px;" onerror="this.src='https://via.placeholder.com/250?text=Upload+Photo'">
        <h2 style="color: var(--strawberry);">Will you be my Valentine?</h2>
        <button onclick="alert('Yay! ❤️')" style="background: var(--matcha); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer;">Yes!</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- LEVEL 1: MAP ---
        const sujata = [18.54014, 73.88345];
        const soup = [18.53755, 73.87965];
        let map = L.map('map').setView(sujata, 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const usIcon = L.divIcon({
            className: 'custom-marker',
            html: '<img src="us.jpg" style="width:50px;height:50px;border-radius:50%;border:3px solid white;" onerror="this.src=\'https://via.placeholder.com/50/ffb5a7/ffffff?text=US\'">',
            iconSize: [50, 50]
        });

        const marker = L.marker(sujata, { icon: usIcon, draggable: true }).addTo(map);
        marker.on('dragend', function() {
            if (marker.getLatLng().distanceTo(L.latLng(soup)) < 400) {
                alert("Level 1 Clear! 🍓");
                nextLevel(2);
            }
        });

        function nextLevel(lvl) {
            document.querySelectorAll('.game-level').forEach(el => el.classList.add('hidden'));
            document.getElementById('level-' + lvl).classList.remove('hidden');
            if (lvl === 2) createChess();
        }

        // --- LEVEL 2: CUSTOM CHESS (FAIL-PROOF) ---
        function createChess() {
            const board = document.getElementById('chess-board');
            board.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const row = Math.floor(i / 8);
                const col = i % 8;
                const sq = document.createElement('div');
                sq.className = 'square ' + ((row + col) % 2 === 0 ? 'white-sq' : 'black-sq');
                
                // Place King and Rook
                if (i === 4) sq.innerText = '♚'; // Black King
                if (i === 60) {
                    sq.innerText = '🏰'; // White Rook
                    sq.className += ' rook';
                    sq.onclick = () => { sq.innerText = ''; window.rookSelected = true; };
                }
                
                sq.onmousedown = () => {
                    if (window.rookSelected && row === 0) {
                        sq.innerText = '🏰';
                        alert("Checkmate! 🍵 Proceeding to the verdict.");
                        nextLevel(3);
                    }
                };
                board.appendChild(sq);
            }
        }
    </script>
</body>
</html>
